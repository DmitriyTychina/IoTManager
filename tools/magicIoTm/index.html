<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>magicIoTm — Конфигуратор прошивок IoTmanager</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#333;background:#f0f2f5}
:root{--bg:#f0f2f5;--panel:#fff;--accent:#4a90d9;--accent2:#2d7d46;--danger:#d94a4a;--warn:#d9a44a;--border:#ddd;--text:#333;--muted:#888}
body.dark{--bg:#1a1a2e;--panel:#16213e;--accent:#4a90d9;--accent2:#2d7d46;--danger:#d94a4a;--warn:#d9a44a;--border:#2a2a4a;--text:#eee;--muted:#888}
body.dark{background:var(--bg);color:var(--text)}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:280px;min-width:280px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Sidebar */
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sidebar-header h1{font-size:16px;font-weight:600;flex:1}
.sidebar-actions{padding:8px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.sidebar-actions button{font-size:12px;padding:4px 8px}
.project-tree{flex:1;overflow-y:auto;padding:8px;scrollbar-width:none;-ms-overflow-style:none}
.project-tree::-webkit-scrollbar{width:0;height:0;display:none}
.tree-category{margin-bottom:2px}
.tree-cat-header{display:flex;align-items:center;padding:4px 8px;cursor:pointer;border-radius:4px;font-weight:600;font-size:13px}
.tree-cat-header:hover{background:rgba(74,144,217,0.1)}
.tree-cat-header .cat-actions{margin-left:auto;display:flex;gap:4px;visibility:hidden;pointer-events:none}
.tree-cat-header:hover .cat-actions{visibility:visible;pointer-events:auto}
.tree-projects{margin-left:12px;margin-top:2px}
.tree-project{display:flex;align-items:center;padding:4px 8px;cursor:pointer;border-radius:4px;font-size:13px}
.tree-project:hover{background:rgba(74,144,217,0.1)}
.tree-project.active{background:var(--accent);color:#fff}
.tree-project .proj-actions{margin-left:auto;display:flex;gap:4px;visibility:hidden;pointer-events:none}
.tree-project:hover .proj-actions,.tree-project.active .proj-actions{visibility:visible;pointer-events:auto}
.tree-project .proj-actions button{cursor:pointer}

/* Проект PlatformIO (в стиле дерева, с разделителями) */
.platformio-sep{margin:2px 8px 0;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);padding:4px 2px}
.platformio-sep .tree-project{padding:4px 8px;font-size:13px}
.platformio-sep .proj-actions button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.platformio-sep .proj-actions button span{transform:translate(1px,1px)}

/* Main content */
.topbar{padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:50}
.topbar .project-name{font-weight:600;font-size:14px}
.topbar .platform-select{display:flex;align-items:center;gap:6px}
.topbar .baseline-size{font-size:12px;color:var(--muted);white-space:nowrap}
.topbar select{padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--panel);color:var(--text)}
.build-upload{margin-left:auto;display:flex;align-items:center;gap:8px}
.build-upload .btn-build,
.build-upload .btn-upload{font-size:18px;line-height:1;padding:3px 7px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:4px}
.build-upload .btn-build:hover,
.build-upload .btn-upload:hover{background:rgba(74,144,217,0.12);border-color:var(--accent);color:var(--text)}

/* Gauge */
.gauge-bar{padding:3px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px}
.gauge-label{font-size:13px;font-weight:700;white-space:nowrap;min-width:50px}
.gauge-track{flex:1;height:13px;background:#e0e0e0;border-radius:7px;overflow:hidden;position:relative}
body.dark .gauge-track{background:#2a2a4a}
.gauge-fill{height:100%;border-radius:12px;transition:width 0.3s,background 0.3s;width:0%}
.gauge-text{font-size:13px;font-weight:600;white-space:nowrap}

/* Content area */
.content{flex:1;overflow-y:auto;padding:16px}
.content-section{background:var(--panel);border-radius:8px;padding:16px;margin-bottom:16px}
.content-section h2{font-size:15px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row{display:flex;flex-direction:column;gap:4px}
.form-row label{font-size:12px;color:var(--muted)}
.form-row input,.form-row select,.form-row textarea{padding:6px 8px;border:1px solid var(--border);border-radius:4px;background:var(--panel);color:var(--text);font-size:13px}
.form-row input.invalid{border-color:var(--danger)}
.form-hint{font-size:11px;color:var(--danger)}
.form-hint.ok{color:var(--accent2)}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{flex:1;padding-right:32px}
.pw-toggle{position:absolute;right:4px;background:none;border:none;cursor:pointer;font-size:15px;padding:2px;line-height:1}
.pw-toggle:hover{background:none;color:var(--accent)}
.group-separator{position:relative;display:flex;align-items:center;margin:18px 0 8px;height:2px;background:var(--accent);opacity:0.9}
.group-separator .group-title{position:absolute;left:0;top:-11px;background:var(--panel);padding:0 8px 0 0;font-size:15px;color:var(--text);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;line-height:22px}
.group-separator button{position:absolute;right:0;top:-9px;font-size:11px;padding:1px 10px;white-space:nowrap;background:var(--panel);line-height:18px}
.group-separator:first-child{margin-top:0}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-header h2{font-size:15px;margin:0;padding:0;border:none}
.section-header button{font-size:12px;white-space:nowrap}
.section-tools{display:flex;gap:8px;margin-left:auto}

/* Modules */
.module-list{max-height:500px;overflow-y:auto}
.module-section{margin-bottom:16px}
.module-section h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.module-section h3 .collapse-icon{font-size:12px;color:var(--muted)}
.module-section h3 .count{font-size:12px;color:var(--muted);font-weight:400}
.module-items{overflow:hidden;transition:max-height 0.2s}
.module-items.collapsed{max-height:0 !important}
.module-item{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:4px}
.module-item:hover{background:rgba(74,144,217,0.05)}
.module-item input[type=checkbox]{cursor:pointer}
.module-item label{flex:1;cursor:pointer;font-size:13px}
.module-item.disabled{opacity:0.4}
.module-item .size-tag{font-size:11px;color:var(--muted)}
.module-item button{background:none;border:none;cursor:pointer;font-size:14px;color:var(--accent)}

/* Buttons */
button{padding:6px 12px;border:1px solid var(--border);border-radius:4px;background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;transition:0.15s}
button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#buildCloseBtn:disabled,#buildCloseBtn:disabled:hover{background:#555;color:#999;border-color:#666;opacity:.55;box-shadow:none}
button.btn-danger:hover{background:var(--danger);border-color:var(--danger)}
button.btn-sm{padding:2px 6px;font-size:11px}
button.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal{background:var(--panel);border-radius:8px;padding:20px;min-width:360px;max-width:500px}
.modal h3{margin-bottom:12px}
.modal .form-row{margin-bottom:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* Build modal */
.build-modal{min-width:640px;max-width:860px;width:90%}
.build-modal h3{margin:0 0 8px}
.build-modal .build-sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.build-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.build-step{flex:1;min-width:150px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--panel);display:flex;align-items:center;gap:6px}
.build-step .bs-name{font-weight:600}
.build-step.pending{opacity:.55}
.build-step.running{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.build-step.running .bs-badge::after{content:"…";animation:blink 1s infinite}
.build-step.done{border-color:#4caf50;color:#4caf50}
.build-step.error{border-color:var(--danger);color:var(--danger)}
.build-log{background:#0d1117;color:#c9d1d9;font-family:Consolas,'Courier New',monospace;font-size:12px;line-height:1.45;height:300px;overflow-y:auto;padding:10px;border-radius:6px;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.build-sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:12px}
.size-card{border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px}
.size-card .sc-title{display:block;margin-bottom:4px;color:var(--muted)}
.size-card .sc-val{font-weight:600;font-size:13px}
.size-card .sc-bar{height:6px;background:var(--border);border-radius:3px;margin-top:6px;overflow:hidden}
.size-card .sc-fill{height:100%;background:#4caf50}
.size-card.warn .sc-fill{background:#ff9800}
.size-card.danger .sc-fill{background:#f44336}
@keyframes blink{50%{opacity:.3}}
.build-error{background:rgba(244,67,54,.1);border:1px solid var(--danger);color:var(--danger);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:12px}
.build-success-msg{color:#4caf50;font-weight:600;margin-bottom:12px}
.modal-actions .build-success-msg{margin-bottom:0;align-self:center;margin-right:auto}
.measure-scope-list{display:flex;flex-direction:column;gap:8px}
.measure-scope-list button{text-align:left;padding:8px 10px;font-size:13px}
.measure-scope-list button .ms-desc{display:block;color:var(--muted);font-size:11px;margin-top:2px}

/* Toast */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:4px;color:#fff;font-size:13px;animation:slideIn 0.3s}
.toast.success{background:var(--accent2)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warn)}
.toast.info{background:var(--accent)}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}

/* Empty state */
.empty-state{text-align:center;padding:40px;color:var(--muted)}
.empty-state h2{font-size:18px;margin-bottom:8px}

/* About textarea */
textarea{resize:vertical;min-height:60px;font-family:inherit}

/* Responsive */
@media(max-width:768px){.form-grid{grid-template-columns:1fr}.sidebar{width:220px;min-width:220px}}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>magicIoTm</h1>
      <button class="btn-sm" onclick="toggleTheme()" title="Тема">🌙</button>
    </div>
    <div class="platformio-sep">
      <div class="tree-project" id="platformioEntry" title="Проект PlatformIO" onclick="openProject('__virtual__','PlatformIO')">
        🛠️ PlatformIO
        <div class="proj-actions">
          <button class="btn-sm" title="Копировать в другой проект" onclick="event.stopPropagation();showCopy('__virtual__','PlatformIO')"><span>⧉</span></button>
        </div>
      </div>
    </div>
    <div class="sidebar-actions">
      <button class="btn-sm btn-primary" onclick="showCreateCategory()" title="Создать новую категорию">+ Категория</button>
      <button class="btn-sm btn-primary" onclick="showCreateProject()" title="Создать новый проект">+ Проект</button>
      <button class="btn-sm" onclick="loadProjects()" title="Обновить список проектов">🔄</button>
    </div>
    <div class="project-tree" id="projectTree">
      <div class="empty-state" style="padding:20px"><p>Нет проектов</p></div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <span class="project-name" id="topProjectName" style="display:none">Проект не выбран</span>
      <div class="platform-select" id="platformSelectWrap" style="display:none">
        <label>Платформа:</label>
        <select id="platformSelect" onchange="changePlatform()"></select>
        <button class="btn-sm" title="Замер размера прошивки без модулей" onclick="startMeasure('baseline','')">⚖️ Замер базы</button>
        <span id="baselineSize" class="baseline-size"></span>
      </div>
      <div class="build-upload">
        <button class="btn-sm btn-build" title="Сборка (Build)" onclick="startBuild()">🔨</button>
        <button class="btn-upload" title="Загрузка (Upload)" onclick="event.stopPropagation()">🚀</button>
        <button class="btn-upload" title="OTA (обновление по воздуху)" onclick="event.stopPropagation()">📡</button>
      </div>
    </div>

    <div class="gauge-bar" id="gaugeBar" style="display:none">
      <span class="gauge-label">FLASH:</span>
      <div class="gauge-track"><div class="gauge-fill" id="gaugeFillFlash"></div></div>
      <span class="gauge-text" id="gaugeTextFlash">0%</span>
      <span class="gauge-text" id="gaugeDetailFlash" style="font-weight:400;font-size:11px;color:var(--muted)"></span>
    </div>
    <div class="gauge-bar" id="gaugeBarRam" style="display:none">
      <span class="gauge-label">RAM:</span>
      <div class="gauge-track"><div class="gauge-fill" id="gaugeFillRam"></div></div>
      <span class="gauge-text" id="gaugeTextRam">0%</span>
      <span class="gauge-text" id="gaugeDetailRam" style="font-weight:400;font-size:11px;color:var(--muted)"></span>
    </div>
    <div class="gauge-bar" id="gaugeBarFs" style="display:none">
      <span class="gauge-label">FS:</span>
      <div class="gauge-track"><div class="gauge-fill" id="gaugeFillFs"></div></div>
      <span class="gauge-text" id="gaugeTextFs">0%</span>
      <span class="gauge-text" id="gaugeDetailFs" style="font-weight:400;font-size:11px;color:var(--muted)"></span>
    </div>

    <div class="content" id="content">
      <div class="empty-state">
        <h2>Добро пожаловать в magicIoTm</h2>
        <p>Создайте или выберите проект для начала работы</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal container -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Build modal -->
<div class="modal-overlay" id="buildOverlay">
  <div class="modal build-modal">
    <h3>🔨 Сборка прошивки</h3>
    <div class="build-sub" id="buildSub">Проект: —</div>
    <div class="build-steps" id="buildSteps"></div>
    <div class="build-log" id="buildLog"></div>
    <div class="build-sizes" id="buildSizes" style="display:none"></div>
    <div class="build-error" id="buildError" style="display:none"></div>
    <div class="modal-actions">
      <div class="build-success-msg" id="buildSuccessMsg" style="display:none"></div>
      <button id="buildCloseBtn" onclick="closeBuildModal()" disabled title="Кнопка станет активной после завершения сборки">Закрыть</button>
    </div>
  </div>
</div>

<!-- Measure modal -->
<div class="modal-overlay" id="measureOverlay">
  <div class="modal build-modal">
    <h3 id="measureTitle">⚖️ Замер размера модулей</h3>
    <div class="build-sub" id="measureSub">—</div>
    <div class="build-log" id="measureLog"></div>
    <div class="build-error" id="measureError" style="display:none"></div>
    <div class="modal-actions">
      <div class="build-success-msg" id="measureSuccessMsg" style="display:none"></div>
      <button id="measureCloseBtn" onclick="closeMeasureModal()" disabled title="Кнопка станет активной после завершения замера">Закрыть</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ==================== State ====================
let configData = null;
let currentProject = null;
let collapsedCats = new Set();
let projectAbout = {};
let moduleCompat = {};

// ==================== Init ====================
document.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('magicIoTm_dark') === '1') document.body.classList.add('dark');
  loadProjects();
  // По умолчанию открываем проект PlatformIO
  openProject('__virtual__', 'PlatformIO');
});

// ==================== Theme ====================
function toggleTheme(){
  document.body.classList.toggle('dark');
  localStorage.setItem('magicIoTm_dark', document.body.classList.contains('dark')?'1':'0');
}

// ==================== Toast ====================
function toast(msg, type='info'){
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)}, 3000);
}

// ==================== Projects ====================
async function loadProjects(){
  const r = await fetch('/api/projects');
  const d = await r.json();
  if(!d.success) return;
  projectAbout = d.about || {};
  renderTree(d.tree);
}

function renderTree(tree){
  const el = document.getElementById('projectTree');
  if(!tree || Object.keys(tree).length === 0){
    el.innerHTML = '<div class="empty-state" style="padding:20px"><p>Нет проектов.<br>Создайте категорию и проект.</p></div>';
    return;
  }
  let html = '';
  for(const [cat, projs] of Object.entries(tree)){
    html += `<div class="tree-category">
      <div class="tree-cat-header" onclick="toggleCat('${esc(cat)}', this)">
        📁 ${esc(cat)}
        <div class="cat-actions">
          <button class="btn-sm" title="Создать проект в этой категории" onclick="event.stopPropagation();showCreateProject('${esc(cat)}')">+</button>
          <button class="btn-sm" title="Переименовать категорию" onclick="event.stopPropagation();showRenameCategory('${esc(cat)}')">✎</button>
          <button class="btn-sm btn-danger" title="Удалить категорию со всеми проектами" onclick="event.stopPropagation();deleteCategory('${esc(cat)}')">✕</button>
        </div>
      </div>
      <div class="tree-projects"${collapsedCats.has(cat)?' style="display:none"':''}>`;
    for(const p of projs){
      const active = currentProject && currentProject.category===cat && currentProject.name===p;
      const desc = projectAbout[cat+'/'+p] || '';
      html += `<div class="tree-project ${active?'active':''}" onclick="openProject('${esc(cat)}','${esc(p)}')" title="${esc(desc)}">
        🛠️ ${esc(p)}
        <div class="proj-actions">
          <button class="btn-sm" title="Переименовать" onclick="event.stopPropagation();showRename('${esc(cat)}','${esc(p)}')">✎</button>
          <button class="btn-sm" title="Копировать" onclick="event.stopPropagation();showCopy('${esc(cat)}','${esc(p)}')">⧉</button>
          <button class="btn-sm" title="Перенести в другую категорию" onclick="event.stopPropagation();showMove('${esc(cat)}','${esc(p)}')">➔</button>
          <button class="btn-sm btn-danger" title="Удалить" onclick="event.stopPropagation();deleteProject('${esc(cat)}','${esc(p)}')">✕</button>
        </div>
      </div>`;
    }
    html += '</div></div>';
  }
  el.innerHTML = html;
  updatePlatformioActive();
}

// Сворачивание/разворачивание категории с сохранением состояния при перерисовке
function toggleCat(cat, el){
  const body = el.nextElementSibling;
  if(!body) return;
  if(collapsedCats.has(cat)){
    collapsedCats.delete(cat);
    body.style.display = 'block';
  } else {
    collapsedCats.add(cat);
    body.style.display = 'none';
  }
}

// Обновление подсветки проекта PlatformIO
function updatePlatformioActive(){
  const el = document.getElementById('platformioEntry');
  if(!el) return;
  el.classList.toggle('active', !!(currentProject && currentProject.name === 'PlatformIO'));
}

async function openProject(cat, name){
  // Проект PlatformIO открывается через специальный endpoint
  let url;
  if(name === 'PlatformIO'){
    url = '/api/platformio/open';
  } else {
    url = `/api/projects/${encodeURIComponent(cat)}/${encodeURIComponent(name)}/open`;
  }
  const r = await fetch(url, {method:'POST'});
  const d = await r.json();
  if(!d.success){ toast(d.error||'Ошибка', 'error'); return; }
  configData = d.config;
  currentProject = {category: cat, name: name};
  const isPio = (name === 'PlatformIO');
  const displayName = isPio ? 'PlatformIO' : `${cat} / ${name}`;
  document.getElementById('topProjectName').textContent = displayName;
  document.getElementById('platformSelectWrap').style.display = 'flex';
  document.getElementById('gaugeBar').style.display = 'flex';
  document.getElementById('gaugeBarRam').style.display = 'flex';
  document.getElementById('gaugeBarFs').style.display = 'flex';
  await loadPlatforms();
  await loadCompatibility();
  renderContent(d.about || '');
  updateGauge();
  loadProjects(); // обновить дерево (active)
}

// ==================== Platforms ====================
async function loadPlatforms(){
  const r = await fetch('/api/platforms');
  const d = await r.json();
  const sel = document.getElementById('platformSelect');
  sel.innerHTML = '';
  if(d.success && d.platforms){
    d.platforms.forEach(p=>{
      const o = document.createElement('option');
      o.value = p.name; o.textContent = p.name;
      o.dataset.baseline = p.baseline_flash || 0;
      sel.appendChild(o);
    });
  }
  // Установить текущую
  const de = configData?.projectProp?.platformio?.default_envs;
  if(de) sel.value = de;
  renderBaselineSize();
}

function renderBaselineSize(){
  const sel = document.getElementById('platformSelect');
  const el = document.getElementById('baselineSize');
  if(!el) return;
  const opt = sel.selectedOptions[0];
  const b = opt ? parseInt(opt.dataset.baseline||0, 10) : 0;
  if(b > 0){
    el.style.display = 'inline';
    el.textContent = 'Базовый размер ' + formatBytes(b);
  } else {
    el.style.display = 'none';
  }
}

async function changePlatform(){
  const plat = document.getElementById('platformSelect').value;
  const r = await fetch('/api/platform/change', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:plat})});
  const d = await r.json();
  if(d.success){
    // Перечитываем конфиг с сервера — backend сам снял галочки с несовместимых модулей
    configData = await (await fetch('/api/config')).json();
    await loadCompatibility();
    renderModules();
    updateGauge();
    renderBaselineSize();
    if(d.disabled_count > 0) toast(`Отключено модулей: ${d.disabled_count}`, 'warning');
  }
}

// ==================== Settings ====================
const SETTING_GROUPS = [
  { title:'Устройство', fields:[['name','Имя устройства','text'],['wg','WG группа','text']] },
  { title:'Точка доступа (AP)', fields:[['apssid','AP SSID','text'],['appass','AP пароль','password']] },
  { title:'Router (Wi-Fi клиент)', fields:[['routerssid','Router SSID','text'],['routerpass','Router пароль','password']] },
  { title:'Время', fields:[['timezone','Часовой пояс','number'],['ntp','NTP сервер','text']] },
  { title:'Web-интерфейс', fields:[['weblogin','Web логин','text'],['webpass','Web пароль','password']] },
  { title:'MQTT', fields:[['mqttServer','MQTT сервер','text'],['mqttPort','MQTT порт','number'],['mqttPrefix','MQTT префикс','text'],['mqttUser','MQTT пользователь','text'],['mqttPass','MQTT пароль','password'],['mqttin','MQTT in (0/1)','number']] },
  { title:'Сервер', fields:[['serverip','Сервер (IP/URL)','text'],['serverlocal','Локальный сервер','text']] },
  { title:'I2C', fields:[['pinSCL','SCL пин','number'],['pinSDA','SDA пин','number'],['i2cFreq','I2C частота','number']] },
  { title:'Прочее', fields:[['log','Логирование (0/1)','number']] }
];

function renderSettings(){
  const container = document.getElementById('settingsContainer');
  if(!container) return;
  const s = configData?.iotmSettings || {};
  let html = '';
  for(const group of SETTING_GROUPS){
    // Показываем только поля, которые есть в конфиге (name — всегда)
    const present = group.fields.filter(([key])=> s.hasOwnProperty(key) || key === 'name');
    if(present.length === 0) continue;
    const keys = present.map(([k])=>k);
    html += `<div class="group-separator">
      <span class="group-title">${group.title}</span>
      <button class="btn-sm" title="Скопировать значения группы «${group.title}» из другого проекта" onclick="showCopyValuesModal('${keys.join(',')}','${group.title}')">⧉ Из другого проекта</button>
    </div>`;
    html += `<div class="form-grid">`;
    for(const [key, label, type] of present){
      const val = s[key] !== undefined ? s[key] : '';
      html += `<div class="form-row">
        <label>${label} <small style="color:var(--muted)">(${key})</small></label>`;
      if(type === 'password'){
        html += `<div class="pw-wrap">
          <input type="password" id="set_${key}" value="${esc(String(val))}" onchange="saveSetting('${key}', this.value)">
          <button type="button" class="pw-toggle" id="btn_set_${key}" title="Показать/скрыть пароль" onclick="togglePass('set_${key}')">🔓</button>
        </div>`;
      } else {
        html += `<input type="${type}" id="set_${key}" value="${esc(String(val))}" onchange="saveSetting('${key}', this.value)" oninput="validateField('${key}', this)">`;
      }
      html += `<div class="form-hint" id="hint_${key}"></div></div>`;
    }
    html += '</div>';
  }
  container.innerHTML = html;
  // Валидация при рендере
  const nameEl = document.getElementById('set_name');
  if(nameEl) validateField('name', nameEl);
  const apssidEl = document.getElementById('set_apssid');
  if(apssidEl) validateField('apssid', apssidEl);
}

function togglePass(id){
  const inp = document.getElementById(id);
  const btn = document.getElementById('btn_' + id);
  if(!inp) return;
  if(inp.type === 'password'){ inp.type='text'; btn.textContent='🔒'; }
  else { inp.type='password'; btn.textContent='🔓'; }
}

async function saveSetting(key, value){
  // Преобразуем числа
  const numFields = ['timezone','mqttPort','log','mqttin','pinSCL','pinSDA','i2cFreq'];
  if(numFields.includes(key)) value = parseInt(value) || 0;
  const settings = {}; settings[key] = value;
  await fetch('/api/config/settings', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(settings)});
  if(configData.iotmSettings) configData.iotmSettings[key] = value; else configData.iotmSettings = {[key]:value};
}

let aboutTimer = null;
function debounceSaveAbout(){
  clearTimeout(aboutTimer);
  aboutTimer = setTimeout(async () => {
    const ta = document.getElementById('aboutText');
    if(!ta || !currentProject) return;
    await fetch('/api/config/about', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:ta.value})});

async function validateField(key, input){
  const hint = document.getElementById('hint_' + key);
  if(!hint) return;
  if(key === 'name'){
    const val = input.value.trim();
    if(!val){ hint.textContent='Имя обязательно'; hint.className='form-hint'; input.classList.add('invalid'); return; }
    if(val.length > 16){ hint.textContent='Максимум 16 символов'; hint.className='form-hint'; input.classList.add('invalid'); return; }
    if(val.includes(' ')){ hint.textContent='Без пробелов'; hint.className='form-hint'; input.classList.add('invalid'); return; }
    const r = await fetch(`/api/validate/name?value=${encodeURIComponent(val)}&project=${currentProject?currentProject.category+'/'+currentProject.name:''}`);
    const d = await r.json();
    if(d.valid){ hint.textContent='✓ Уникально'; hint.className='form-hint ok'; input.classList.remove('invalid'); input.removeAttribute('title'); }
    else{ hint.textContent=d.message; hint.className='form-hint'; input.classList.add('invalid'); input.title=d.message; }
  }
  if(key === 'apssid' && input.value.trim()){
    const r = await fetch(`/api/validate/apssid?value=${encodeURIComponent(input.value.trim())}&project=${currentProject?currentProject.category+'/'+currentProject.name:''}`);
    const d = await r.json();
    if(d.valid){ hint.textContent='✓ Уникально'; hint.className='form-hint ok'; input.classList.remove('invalid'); input.removeAttribute('title'); }
    else{ hint.textContent=d.message; hint.className='form-hint'; input.classList.add('invalid'); input.title=d.message; }
  }
}

// ==================== Modules ====================
let moduleCollapsed = {}; // {section: true/false}

function renderModules(){
  const el = document.getElementById('moduleList');
  if(!el || !configData?.modules) return;
  let html = '';
  for(const [section, mods] of Object.entries(configData.modules)){
    if(!Array.isArray(mods) || mods.length === 0) continue;
    const collapsed = moduleCollapsed[section] !== false; // по умолчанию свёрнуты
    const icon = collapsed ? '▶' : '▼';
    html += `<div class="module-section">
      <h3 onclick="toggleModuleGroup('${esc(section)}')"><span class="collapse-icon">${icon}</span> ${esc(section)} <span class="count">(${mods.filter(m=>m.active).length}/${mods.length})</span></h3>
      <div class="module-items ${collapsed?'collapsed':''}" id="moditems_${esc(section)}">`;
    for(const m of mods){
      const name = (m.path||'').split('/').pop();
      const comp = moduleCompat[m.path] || {compatible:true, size:0};
      const disabled = comp.compatible ? '' : 'disabled';
      const checked = m.active ? 'checked' : '';
      const sizeStr = comp.size > 0 ? `<span class="size-tag">${formatBytes(comp.size)}</span>` : `<span class="size-tag">- КБ</span>`;
      const compatTag = comp.compatible ? '' : ' <span class="size-tag" style="color:var(--danger)">не совместим</span>';
      html += `<div class="module-item ${disabled}">
        <input type="checkbox" id="mod_${name}" ${checked} ${comp.compatible?'':'disabled'} onchange="toggleModule('${esc(section)}','${esc(m.path||'')}',this.checked)">
        <label for="mod_${name}">${esc(name)}${compatTag}</label> ${sizeStr}
        <button onclick="showModuleInfo('${esc(m.path||'')}')" title="Подробная информация о модуле">ℹ️</button>
        <button onclick="measureModule('${esc(m.path||'')}')" title="Замер размера модуля">⚖️</button>
      </div>`;
    }
    html += '</div></div>';
  }
  el.innerHTML = html;
}

function toggleModuleGroup(section){
  const cur = moduleCollapsed[section] !== false; // текущее состояние
  moduleCollapsed[section] = !cur; // переключаем
  const items = document.getElementById('moditems_' + section);
  if(items){
    if(moduleCollapsed[section]) items.classList.add('collapsed');
    else items.classList.remove('collapsed');
  }
  // Обновляем иконку
  const h3 = items?.previousElementSibling?.querySelector('.collapse-icon');
  if(h3) h3.textContent = moduleCollapsed[section] ? '▶' : '▼';
}

async function toggleModule(section, path, active){
  const r = await fetch('/api/modules/toggle', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({section,path,active})});
  const d = await r.json();
  if(d.success){
    // Обновляем локально
    const mods = configData.modules[section] || [];
    const m = mods.find(x=>x.path===path);
    if(m) m.active = active;
    renderModules();
    updateGauge();
  }
}

// ==================== Gauge ====================
function setGauge(kind, pct, used, total){
  const suffix = kind === 'ram' ? 'Ram' : (kind === 'fs' ? 'Fs' : 'Flash');
  const fill = document.getElementById('gaugeFill' + suffix);
  const text = document.getElementById('gaugeText' + suffix);
  const detail = document.getElementById('gaugeDetail' + suffix);
  if(!fill) return;
  pct = Math.min(pct, 100);
  fill.style.width = pct + '%';
  let color = '#4caf50';
  if(pct > 90) color = '#f44336';
  else if(pct > 70) color = '#ff9800';
  fill.style.background = color;
  text.textContent = pct + '%';
  detail.textContent = `${formatBytes(used||0)} / ${formatBytes(total||0)}`;
}

async function updateGauge(){
  const r = await fetch('/api/size');
  const d = await r.json();
  if(!d) return;
  setGauge('flash', d.flash_pct || 0, d.flash_used, d.flash_total);
  setGauge('ram', d.ram_pct || 0, d.ram_used, d.ram_total);
  setGauge('fs', d.fs_pct || 0, d.fs_used, d.fs_total);
}

function formatBytes(b){
  if(b >= 1048576) return (b/1048576).toFixed(1)+' МБ';
  if(b >= 1024) return (b/1024).toFixed(1)+' КБ';
  return b+' б';
}

// ==================== Build ====================
const BUILD_STEPS = [
  {id:1, name:'Подготовка профиля'},
  {id:2, name:'Файловая система (buildfs)'},
  {id:3, name:'Сборка прошивки'}
];
let buildStream = null;
let buildDone = false;

function openBuildModal(){
  document.getElementById('buildSteps').innerHTML = BUILD_STEPS.map(s=>
    `<div class="build-step pending" id="bst_${s.id}"><span class="bs-badge"></span><span class="bs-name">${s.name}</span></div>`
  ).join('');
  document.getElementById('buildLog').textContent = '';
  document.getElementById('buildSizes').style.display = 'none';
  document.getElementById('buildSizes').innerHTML = '';
  document.getElementById('buildError').style.display = 'none';
  document.getElementById('buildSuccessMsg').style.display = 'none';
  document.getElementById('buildCloseBtn').disabled = true;
  buildDone = false;
  document.getElementById('buildOverlay').classList.add('active');
}

function closeBuildModal(){
  if(buildStream){ buildStream.close(); buildStream = null; }
  buildDone = true;
  document.getElementById('buildOverlay').classList.remove('active');
  const btn = document.querySelector('.btn-build');
  if(btn){ btn.disabled = false; btn.style.opacity = ''; }
}

function setBuildStep(id, status){
  const el = document.getElementById('bst_'+id);
  if(!el) return;
  el.className = 'build-step ' + status;
}

function appendBuildLog(text){
  const el = document.getElementById('buildLog');
  el.textContent += text + '\n';
  el.scrollTop = el.scrollHeight;
}

function sizeClass(pct){
  if(pct > 90) return 'danger';
  if(pct > 70) return 'warn';
  return '';
}

function renderBuildSizes(s){
  const cards = [
    {t:'Прошивка (FLASH)', u:s.flash_used, to:s.flash_total, pct:s.flash_pct},
    {t:'Оперативная память (RAM)', u:s.ram_used, to:s.ram_total, pct:s.ram_pct},
    {t:'Файловая система', u:s.fs_used, to:s.fs_total, pct:s.fs_pct}
  ];
  document.getElementById('buildSizes').innerHTML = cards.map(c=>
    `<div class="size-card ${sizeClass(c.pct)}">
       <span class="sc-title">${c.t}</span>
       <span class="sc-val">${formatBytes(c.u)} / ${formatBytes(c.to)} (${c.pct}%)</span>
       <div class="sc-bar"><div class="sc-fill" style="width:${Math.min(c.pct,100)}%"></div></div>
     </div>`
  ).join('');
  document.getElementById('buildSizes').style.display = 'grid';
}

function buildFinish(){
  const btn = document.getElementById('buildCloseBtn');
  btn.disabled = false;
  btn.title = 'Закрыть';
  const hbtn = document.querySelector('.btn-build');
  if(hbtn){ hbtn.disabled = false; hbtn.style.opacity = ''; }
  if(buildStream){ buildStream.close(); buildStream = null; }
  buildDone = true;
}

async function startBuild(){
  if(!currentProject){ toast('Сначала откройте проект', 'error'); return; }
  // Сохраняем текущий конфиг перед сборкой
  if(configData){
    await fetch('/api/config/save', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(configData)});
  }
  const r = await fetch('/api/build/start', {method:'POST'});
  const d = await r.json();
  if(!d.success){ toast(d.error || 'Ошибка запуска сборки', 'error'); return; }

  openBuildModal();
  document.getElementById('buildSub').textContent =
    'Проект: ' + (currentProject.name === 'PlatformIO' ? 'PlatformIO' : `${currentProject.category} / ${currentProject.name}`);

  const hbtn = document.querySelector('.btn-build');
  if(hbtn){ hbtn.disabled = true; hbtn.style.opacity = '0.5'; }

  buildStream = new EventSource('/api/build/stream');
  buildStream.addEventListener('log', e => appendBuildLog(JSON.parse(e.data).text));
  buildStream.addEventListener('step', e => {
    const d = JSON.parse(e.data);
    setBuildStep(d.id, d.status);
  });
  buildStream.addEventListener('done', e => {
    const d = JSON.parse(e.data);
    if(d.sizes) renderBuildSizes(d.sizes);
    const msg = document.getElementById('buildSuccessMsg');
    msg.style.display = 'block';
    msg.textContent = '✅ Прошивка успешно собрана.';
    buildFinish();
    updateGauge(); // обновляем верхние полосы FLASH/RAM/FS после сборки
  });
  buildStream.addEventListener('error', e => {
    const d = JSON.parse(e.data);
    let txt = 'Ошибка';
    if(d.step) txt += ' на шаге «' + (BUILD_STEPS.find(s=>s.id===d.step)?.name || '') + '»';
    if(d.error) txt += ': ' + d.error;
    document.getElementById('buildError').style.display = 'block';
    document.getElementById('buildError').textContent = '❌ ' + txt;
    buildFinish();
  });
  buildStream.addEventListener('finish', () => {
    if(buildStream){ buildStream.close(); buildStream = null; }
  });
  buildStream.onerror = () => {
    if(!buildDone){
      document.getElementById('buildError').style.display = 'block';
      document.getElementById('buildError').textContent = '⚠️ Соединение со сборкой потеряно. Если сборка ещё идёт, обновите страницу.';
    }
  };
}

let measureStream = null;
let measureDone = false;
let measureScope = '';

function setMeasureButton(text, title, enabled, onclick){
  const btn = document.getElementById('measureCloseBtn');
  if(!btn) return;
  btn.textContent = text;
  btn.title = title || '';
  btn.disabled = !enabled;
  btn.onclick = onclick;
}

function setMeasureTitle(title){
  const el = document.getElementById('measureTitle');
  if(el) el.textContent = title;
}

function openMeasureModal(){
  document.getElementById('measureLog').textContent = '';
  document.getElementById('measureError').style.display = 'none';
  document.getElementById('measureSuccessMsg').style.display = 'none';
  measureDone = false;
  document.getElementById('measureOverlay').classList.add('active');
}

function closeMeasureModal(){
  if(measureStream){ measureStream.close(); measureStream = null; }
  measureDone = true;
  document.getElementById('measureOverlay').classList.remove('active');
}

function appendMeasureLog(text){
  const el = document.getElementById('measureLog');
  el.textContent += text + '\n';
  el.scrollTop = el.scrollHeight;
}

function measureFinish(){
  if(measureStream){ measureStream.close(); measureStream = null; }
  measureDone = true;
  setMeasureButton('Закрыть', 'Закрыть', true, closeMeasureModal);
}

async function abortMeasure(){
  try{
    await fetch('/api/measure/abort', {method:'POST'});
  }catch(_){}
  // Сообщение «✗ Прервано» появится по событию error/aborted от потока.
}

async function startMeasure(scope, modulePath, label){
  if(!currentProject){ toast('Сначала откройте проект', 'error'); return; }
  measureScope = scope;
  const r = await fetch('/api/measure/start', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ scope: scope, module: modulePath || '' })
  });
  const d = await r.json();
  if(!d.success){ toast(d.error || 'Ошибка запуска замера', 'error'); return; }

  const platSel = document.getElementById('platformSelect');
  const platform = platSel ? platSel.value : '';
  const projLabel = label || ('Проект: ' + (currentProject.name === 'PlatformIO' ? 'PlatformIO' : `${currentProject.category} / ${currentProject.name}`));

  if(scope === 'module'){
    setMeasureTitle('⚖️ Замер размера модуля');
    document.getElementById('measureSub').textContent =
      'Модуль: ' + modulePath.split('/').pop() + ' для ' + platform;
  } else if(scope === 'baseline'){
    setMeasureTitle('⚖️ Замер размера прошивки без модулей');
    document.getElementById('measureSub').textContent = 'Платформа: ' + platform;
  } else {
    setMeasureTitle('⚖️ Замер размера модулей');
    document.getElementById('measureSub').textContent = projLabel + ' · Платформа: ' + platform;
  }

  openMeasureModal();
  // Во время запуска кнопка становится «Отмена» (прерывает скрипт, модал не закрывается).
  setMeasureButton('Отмена', 'Прервать замер', true, abortMeasure);

  measureStream = new EventSource('/api/measure/stream');
  measureStream.addEventListener('log', e => appendMeasureLog(JSON.parse(e.data).text));
  measureStream.addEventListener('done', async e => {
    let failed = false;
    try{ failed = !!(JSON.parse(e.data).failed); }catch(_){}
    const msg = document.getElementById('measureSuccessMsg');
    msg.style.display = 'block';
    if(failed && measureScope === 'module'){
      msg.textContent = '✗ Не удалось получить размер - модуль не компилируется, обратитесь к разработчику модуля.';
      msg.style.color = 'var(--danger)';
    } else if(failed){
      msg.textContent = '✗ Замер завершился с ошибками для части модулей';
      msg.style.color = 'var(--danger)';
    } else {
      msg.textContent = '✅ Замер размера завершён успешно.';
      msg.style.color = '#4caf50';
    }
    measureFinish();
    // Перечитываем модифицированные modinfo.json и обновляем размеры модулей и индикаторы
    await fetch('/api/modules/reload', {method:'POST'});
    await loadCompatibility();
    renderModules();
    updateGauge();
    if(measureScope === 'baseline'){ loadPlatforms(); }
  });
  measureStream.addEventListener('error', e => {
    let aborted = false, txt = 'Ошибка замера';
    try{ const d = JSON.parse(e.data); if(d.aborted) aborted = true; if(d.error) txt = d.error; }catch(_){}
    if(aborted){
      const msg = document.getElementById('measureSuccessMsg');
      msg.style.display = 'block';
      msg.textContent = '✗ Прервано';
      msg.style.color = 'var(--danger)';
    } else {
      const errEl = document.getElementById('measureError');
      errEl.style.display = 'block';
      errEl.textContent = '❌ ' + txt;
    }
    measureFinish();
  });
  measureStream.addEventListener('finish', () => {
    if(measureStream){ measureStream.close(); measureStream = null; }
  });
  measureStream.onerror = () => {
    if(!measureDone){
      const errEl = document.getElementById('measureError');
      errEl.style.display = 'block';
      errEl.textContent = '⚠️ Соединение с замером потеряно. Если замер ещё идёт, обновите страницу.';
    }
  };
}

function closeGenericModal(){
  document.getElementById('modalOverlay').classList.remove('active');
}

function pickMeasure(scope){
  closeGenericModal();
  startMeasure(scope, '');
}

// ==================== Modals ====================
function showModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal(e){
  if(!e || e.target.id === 'modalOverlay') document.getElementById('modalOverlay').classList.remove('active');
}

function showCreateCategory(){
  showModal(`<h3>Новая категория</h3>
    <div class="form-row"><label>Имя категории:</label><input type="text" id="catName"></div>
    <div class="modal-actions"><button title="Закрыть без сохранения" onclick="closeModal()">Отмена</button><button class="btn-primary" title="Создать новую категорию" onclick="createCategory()">Создать</button></div>`);
  setTimeout(()=>document.getElementById('catName')?.focus(), 50);
}
async function createCategory(){
  const name = document.getElementById('catName').value.trim();
  if(!name) return;
  const r = await fetch('/api/projects/category', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  const d = await r.json();
  if(d.success){ closeModal(); loadProjects(); toast('Категория создана', 'success'); }
  else toast(d.error||'Ошибка', 'error');
}

function showRenameCategory(cat){
  showModal(`<h3>Переименовать категорию</h3>
    <div class="form-row"><label>Новое имя:</label><input type="text" id="renameCatInput" value="${esc(cat)}"></div>
    <div class="modal-actions"><button title="Закрыть без сохранения" onclick="closeModal()">Отмена</button><button class="btn-primary" title="Переименовать категорию" onclick="renameCategory('${esc(cat)}')">Переименовать</button></div>`);
  setTimeout(()=>document.getElementById('renameCatInput')?.focus(), 50);
}
async function renameCategory(oldName){
  const newName = document.getElementById('renameCatInput').value.trim();
  if(!newName) return;
  const r = await fetch(`/api/projects/category/${encodeURIComponent(oldName)}/rename`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:newName})});
  const d = await r.json();
  if(d.success){ closeModal(); loadProjects(); toast('Категория переименована', 'success'); }
  else toast(d.error||'Ошибка', 'error');
}

async function deleteCategory(name){
  if(!confirm(`Удалить категорию "${name}" со всеми проектами? Будет создана резервная копия.`)) return;
  const r = await fetch(`/api/projects/category/${encodeURIComponent(name)}`, {method:'DELETE'});
  const d = await r.json();
  if(d.success){
    // Если удалена категория текущего проекта — сброс к начальной странице
    if(currentProject && currentProject.category === name) resetToInitial();
    loadProjects();
    toast('Категория удалена', 'info');
  }
  else toast(d.error||'Ошибка', 'error');
}

function showCreateProject(defaultCat=''){
  showModal(`<h3>Новый проект</h3>
    <div class="form-row"><label>Категория:</label><select id="projCat"></select></div>
    <div class="form-row"><label>Имя проекта:</label><input type="text" id="projName" maxlength="16"></div>
    <div class="form-row"><label>Описание:</label><textarea id="projDesc"></textarea></div>
    <div class="modal-actions"><button title="Закрыть без сохранения" onclick="closeModal()">Отмена</button><button class="btn-primary" title="Создать новый проект" onclick="createProject()">Создать</button></div>`);
  // Заполняем категории
  fetch('/api/projects').then(r=>r.json()).then(d=>{
    const sel = document.getElementById('projCat');
    for(const cat of Object.keys(d.tree||{})){
      const o = document.createElement('option');
      o.value = cat; o.textContent = cat;
      if(cat === defaultCat) o.selected = true;
      sel.appendChild(o);
    }
  });
  setTimeout(()=>document.getElementById('projName')?.focus(), 50);
}
async function createProject(){
  const cat = document.getElementById('projCat').value;
  const name = document.getElementById('projName').value.trim();
  const desc = document.getElementById('projDesc').value;
  if(!cat || !name) return;
  const r = await fetch('/api/projects/create', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:cat,name,description:desc})});
  const d = await r.json();
  if(d.success){ closeModal(); loadProjects(); openProject(cat, name); toast('Проект создан', 'success'); }
  else toast(d.error||'Ошибка', 'error');
}

async function deleteProject(cat, name){
  if(!confirm(`Удалить проект "${name}"? Будет создана резервная копия.`)) return;
  const r = await fetch(`/api/projects/${encodeURIComponent(cat)}/${encodeURIComponent(name)}`, {method:'DELETE'});
  const d = await r.json();
  if(d.success){
    // Если удалён текущий проект — сброс к начальной странице
    if(currentProject && currentProject.category === cat && currentProject.name === name) resetToInitial();
    loadProjects();
    toast('Проект удалён', 'info');
  }
  else toast(d.error||'Ошибка', 'error');
}

// ==================== Reset to initial ====================
function resetToInitial(){
  currentProject = null;
  configData = null;
  moduleCompat = {};
  document.getElementById('topProjectName').textContent = 'Проект не выбран';
  document.getElementById('platformSelectWrap').style.display = 'none';
  document.getElementById('gaugeBar').style.display = 'none';
  document.getElementById('gaugeBarRam').style.display = 'none';
  document.getElementById('gaugeBarFs').style.display = 'none';
  document.getElementById('content').innerHTML = `
    <div class="empty-state">
      <h2>Добро пожаловать в magicIoTm</h2>
      <p>Создайте или выберите проект для начала работы</p>
    </div>`;
  updatePlatformioActive();
}

function showRename(cat, name){
  showModal(`<h3>Переименовать проект</h3>
    <div class="form-row"><label>Новое имя:</label><input type="text" id="renameInput" value="${esc(name)}" maxlength="16"></div>
    <div class="modal-actions"><button title="Закрыть без сохранения" onclick="closeModal()">Отмена</button><button class="btn-primary" title="Переименовать проект" onclick="renameProject('${esc(cat)}','${esc(name)}')">Переименовать</button></div>`);
}
async function renameProject(cat, oldName){
  const newName = document.getElementById('renameInput').value.trim();
  if(!newName) return;
  const r = await fetch(`/api/projects/${encodeURIComponent(cat)}/${encodeURIComponent(oldName)}/rename`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:newName})});
  const d = await r.json();
  if(d.success){ closeModal(); loadProjects(); toast('Переименовано', 'success'); }
  else toast(d.error||'Ошибка', 'error');
}

function showCopy(srcCat, srcName){
  showModal(`<h3>Копировать проект</h3>
    <div class="form-row"><label>В категорию:</label><select id="copyDstCat"></select></div>
    <div class="form-row"><label>Имя копии:</label><input type="text" id="copyDstName" value="${esc(srcName)}_copy" maxlength="16"></div>
    <div class="modal-actions"><button title="Закрыть без сохранения" onclick="closeModal()">Отмена</button><button class="btn-primary" title="Создать копию проекта" onclick="copyProject('${esc(srcCat)}','${esc(srcName)}')">Копировать</button></div>`);
  fetch('/api/projects').then(r=>r.json()).then(d=>{
    const sel = document.getElementById('copyDstCat');
    const cats = Object.keys(d.tree||{});
    cats.forEach(cat => {
      const o = document.createElement('option');
      o.value = cat; o.textContent = cat;
      sel.appendChild(o);
    });
    // Выбираем категорию источника, если она реальна; иначе первую доступную
    sel.value = srcCat;
    if(!sel.value && cats.length) sel.selectedIndex = 0;
  });
}
async function copyProject(srcCat, srcName){
  const dstCat = document.getElementById('copyDstCat').value;
  const dstName = document.getElementById('copyDstName').value.trim();
  if(!dstName) return;
  const r = await fetch('/api/projects/copy', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({src_cat:srcCat,src_name:srcName,dst_cat:dstCat,dst_name:dstName})});
  const d = await r.json();
  if(d.success){ closeModal(); loadProjects(); toast('Проект скопирован', 'success'); }
  else toast(d.error||'Ошибка', 'error');
}

function showMove(srcCat, srcName){
  showModal(`<h3>Перенести проект</h3>
    <div class="form-row"><label>В категорию:</label><select id="moveDstCat"></select></div>
    <div class="form-row"><label>Имя проекта:</label><input type="text" id="moveDstName" value="${esc(srcName)}" maxlength="16"></div>
    <div class="modal-actions"><button title="Закрыть без сохранения" onclick="closeModal()">Отмена</button><button class="btn-primary" title="Перенести проект в выбранную категорию" onclick="moveProject('${esc(srcCat)}','${esc(srcName)}')">Перенести</button></div>`);
  fetch('/api/projects').then(r=>r.json()).then(d=>{
    const sel = document.getElementById('moveDstCat');
    for(const cat of Object.keys(d.tree||{})){
      const o = document.createElement('option');
      o.value = cat; o.textContent = cat;
      if(cat !== srcCat) o.selected = true; // по умолчанию — другая категория
      sel.appendChild(o);
    }
  });
  setTimeout(()=>document.getElementById('moveDstName')?.focus(), 50);
}
async function moveProject(srcCat, srcName){
  const dstCat = document.getElementById('moveDstCat').value;
  const dstName = document.getElementById('moveDstName').value.trim();
  if(!dstName) return;
  const r = await fetch('/api/projects/move', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({src_cat:srcCat,src_name:srcName,dst_cat:dstCat,dst_name:dstName})});
  const d = await r.json();
  if(d.success){
    closeModal();
    // Если перемещён текущий проект — переоткрыть на новом месте
    if(currentProject && currentProject.category===srcCat && currentProject.name===srcName){
      await openProject(dstCat, dstName);
    } else {
      loadProjects();
    }
    toast('Проект перемещён', 'success');
  }
  else toast(d.error||'Ошибка', 'error');
}

function showCopyValuesModal(fieldsStr, groupTitle){
  fetch('/api/projects/list-all').then(r=>r.json()).then(d=>{
    if(!d.success) return;
    const opts = d.projects.map(p=>`<option value="${p.category}/${p.name}">${p.category} / ${p.name}</option>`).join('');
    showModal(`<h3>Копировать значения</h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px">${groupTitle ? 'Группа: ' + esc(groupTitle) : 'Все поля, кроме name и apssid'}</p>
      <div class="form-row"><label>Из проекта:</label><select id="copyValSrc">${opts}</select></div>
      <div class="modal-actions"><button title="Закрыть без сохранения" onclick="closeModal()">Отмена</button><button class="btn-primary" title="Скопировать значения из выбранного проекта" onclick="doCopyValues('${esc(fieldsStr)}')">Копировать</button></div>`);
  });
}
async function doCopyValues(fieldsStr){
  const val = document.getElementById('copyValSrc').value;
  const [srcCat, srcName] = val.split('/');
  const r = await fetch(`/api/projects/${encodeURIComponent(srcCat)}/${encodeURIComponent(srcName)}/settings`);
  const d = await r.json();
  if(!d.success){ toast(d.error||'Ошибка','error'); return; }
  const src = d.settings || {};
  // Поля для копирования: если не заданы — все, кроме name и apssid
  let fields = fieldsStr ? fieldsStr.split(',').filter(k=>k) : Object.keys(src);
  fields = fields.filter(k=>k !== 'name' && k !== 'apssid');
  const updates = {};
  for(const f of fields){ if(src.hasOwnProperty(f)) updates[f] = src[f]; }
  if(Object.keys(updates).length === 0){ closeModal(); toast('Нечего копировать','info'); return; }
  const sr = await fetch('/api/config/settings', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(updates)});
  const sd = await sr.json();
  if(sd.success){
    if(configData.iotmSettings) Object.assign(configData.iotmSettings, updates); else configData.iotmSettings = {...updates};
    closeModal();
    renderSettings();
    toast('Значения скопированы', 'success');
  } else toast(sd.error||'Ошибка','error');
}

async function showCopyModules(){
  const r = await fetch('/api/projects/list-all');
  const d = await r.json();
  if(!d.success) return;
  let opts = d.projects.map(p=>`<option value="${p.category}/${p.name}">${p.category} / ${p.name}</option>`).join('');
  showModal(`<h3>Копировать модули</h3>
    <div class="form-row"><label>Из проекта:</label><select id="copyModSrc">${opts}</select></div>
    <div class="modal-actions"><button title="Закрыть без сохранения" onclick="closeModal()">Отмена</button><button class="btn-primary" title="Копировать модули из выбранного проекта" onclick="doCopyModules()">Копировать</button></div>`);
}
async function doCopyModules(){
  const val = document.getElementById('copyModSrc').value;
  const [srcCat, srcName] = val.split('/');
  const r = await fetch('/api/projects/copy-modules', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({src_cat:srcCat,src_name:srcName})});
  const d = await r.json();
  if(d.success){ closeModal(); configData.modules = d.modules; await loadCompatibility(); renderModules(); updateGauge(); toast('Модули скопированы', 'success'); }
  else toast(d.error||'Ошибка', 'error');
}

async function showModuleInfo(path){
  const r = await fetch('/api/modules/info', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});
  const d = await r.json();
  if(!d.success){ toast('Информация недоступна','error'); return; }
  const a = d.info.about || {};
  let html = `<h3>${a.title || a.moduleName || path}</h3>`;
  if(a.moduleDesc) html += `<p style="margin:8px 0">${a.moduleDesc}</p>`;
  if(a.moduleVersion) html += `<p><b>Версия:</b> ${a.moduleVersion}</p>`;
  if(a.authorName) html += `<p><b>Автор:</b> ${a.authorName}</p>`;
  if(a.propInfo){
    html += '<h4 style="margin:10px 0 4px">Параметры:</h4><ul style="padding-left:20px;font-size:12px">';
    for(const [k,v] of Object.entries(a.propInfo)) html += `<li><b>${k}</b>: ${v}</li>`;
    html += '</ul>';
  }
  showModal(html + `<div class="modal-actions"><button title="Закрыть окно" onclick="closeModal()">Закрыть</button></div>`);
}

// ==================== Utils ====================
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); return; }
  // Enter в модалке = клик по главной кнопке (Создать/Копировать/Переименовать)
  if(e.key === 'Enter'){
    const overlay = document.getElementById('modalOverlay');
    if(overlay.classList.contains('active')){
      const primary = overlay.querySelector('.modal-actions .btn-primary');
      if(primary){ e.preventDefault(); primary.click(); }
    }
  }
});
